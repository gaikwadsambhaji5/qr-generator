<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-top:0;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    font-size:15px;
    resize:vertical;
}

input[type=range]{
    width:100%;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    background:#0078ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:6px;
}

button:hover{
    background:#005fd0;
}

#qrcode{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

.size{
    text-align:center;
    margin:10px 0;
}
</style>

</head>
<body>

<div class="container">

<h2>QR Code Generator</h2>

<textarea id="text" placeholder="Enter text or URL..."></textarea>

<div class="size">
Size:
<span id="sizeValue">250</span> px
</div>

<input
type="range"
id="size"
min="100"
max="500"
value="250">

<button onclick="generateQR()">Generate QR Code</button>

<button onclick="downloadQR()">Download PNG</button>

<div id="qrcode"></div>

</div>

<script>

let qr;

generateQR();

document.getElementById("size").oninput=function(){
document.getElementById("sizeValue").innerHTML=this.value;
}

function generateQR(){

let text=document.getElementById("text").value.trim();

if(text===""){
text="https://example.com";
}

let size=parseInt(document.getElementById("size").value);

document.getElementById("qrcode").innerHTML="";

qr=new QRCode(document.getElementById("qrcode"),{
text:text,
width:size,
height:size,
correctLevel:QRCode.CorrectLevel.H
});

}

function downloadQR(){

let img=document.querySelector("#qrcode img");

if(img){

let link=document.createElement("a");

link.href=img.src;

link.download="QRCode.png";

link.click();

}

}

</script>

</body>
</html>
