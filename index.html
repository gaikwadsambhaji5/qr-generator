<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Updated meta tag to completely disable pinch and double-tap zooming on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FEBTECH QR Code Generator</title>
    
    <!-- External Database File -->
    <!-- Make sure database_index.js is in the same folder as this file -->
    <script src="database_index.js"></script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Top Right Tokens Button */
        #tokensBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff9500; 
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            transition: 0.2s;
            width: auto;
            height: auto;
            margin: 0;
        }
        #tokensBtn:hover { background: #e08300; }
        #tokensBtn:active { transform: scale(0.95); }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #111;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            background: white;
            transition: .2s;
        }

        input:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0,122,255,.15);
        }

        input[list] {
            cursor: text;
        }

        .model-box {
            display: flex;
            align-items: center;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .prefix {
            background: #f5f5f7;
            color: #555;
            padding: 0 15px;
            height: 50px;
            display: flex;
            align-items: center;
            font-weight: bold;
            border-right: 1px solid #d1d1d6;
            white-space: nowrap;
        }

        .model-box input {
            border: none;
            border-radius: 0;
            flex: 1;
            height: 50px;
            padding-left: 15px;
            box-shadow: none;
        }

        button.generate-btn {
            width: 100%;
            height: 52px;
            margin-top: 28px;
            border: none;
            border-radius: 12px;
            background: #007AFF;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button.generate-btn:hover { background: #0063d1; }
        button.generate-btn:active { transform: scale(.98); }

        /* Full Screen Modal Styling */
        .modal {
            display: none; 
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 15px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 45px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            z-index: 1010;
        }

        /* QR Code Modal Specifics */
        #qrcode img, #qrcode canvas {
            border: 15px solid white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90vw;
            max-height: 90vw;
        }
        
        .qr-hint {
            color: white;
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .qr-details {
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
        }

        .qr-details strong {
            color: white;
            font-weight: 600;
        }

        /* Tokens Slider Specifics */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 75vh;
        }

        #tokenImg {
            width: 100vw;
            max-height: 75vh; 
            border-radius: 12px;
            object-fit: contain; 
            transition: opacity 0.3s ease;
            touch-action: none; /* Disables pinch zoom */
        }

        .token-title {
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .token-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .nav-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            font-size: 20px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .nav-btn:active { background: rgba(255,255,255,0.5); }
        
        .token-counter {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        @media(max-width: 500px) {
            .container { padding: 20px; border-radius: 16px; }
            h1 { font-size: 24px; }
            .close-btn { top: 20px; right: 20px; font-size: 40px; }
        }
    </style>
</head>
<body>

    <!-- Tokens Button -->
    <button id="tokensBtn" onclick="openTokensModal()">Tokens</button>

    <!-- Main Generator Container -->
    <div class="container">
        <h1>FEBTECH QR Code Generator</h1>

        <!-- Machine -->
        <label>Machine Name</label>
        <input list="machines" id="machine" placeholder="Start typing machine name..." autocomplete="off">
        <datalist id="machines">
            <option value="Febtech's DCM-180">
            <option value="Febtech's DCM-300">
            <option value="Automatic Ladling Machine">
            <option value="Servo Sprayer Two Axis">
            <option value="Linear Servo Sprayer Two Axis">
            <option value="Auto Spray">
            <option value="Servo Sprayer With Extractor Four Axis">
            <option value="Centralized Die-cote Mixing Unit">
            <option value="Vertical Auto Sprayer">
            <option value="Die Coat Container with Mixing Unit">
            <option value="Mould Channel Descaling Unit">
            <option value="Portable Die Coat Mixing Unit">
            <option value="Quenching Tank">
            <option value="Automatic Extractor">
            <option value="Jet Cooling Unit (Open Loop)">
            <option value="Cooling Conveyor">
            <option value="Auto Die Clamping Unit">
            <option value="Jet Cooling Unit (Closed Loop)">
            <option value="Mould Temperature Controller">
            <option value="Mould Vacuum Unit">
            <option value="N2 Degassing Machine">
            <option value="Hoistable Degassing Unit">
            <option value="Vacuum Testing Unit">
            <option value="Density Index Analyzer">
            <option value="Dispenser Unit">
            <option value="Plunger Lubrication Unit">
            <option value="Ejector Pin Cutting Machine">
            <option value="Metal Transfer Ladle">
            <option value="Universal Precision Grinder">
        </datalist>

        <!-- Model -->
        <label>Model Number</label>
        <div class="model-box">
            <span class="prefix">FEBTECH-</span>
            <!-- Added datalist connection for auto-suggestions -->
            <input list="models" type="text" id="model" placeholder="0480A CL" autocomplete="off">
            <datalist id="models"></datalist>
        </div>

        <!-- Serial -->
        <label>Serial Number</label>
        <!-- Added datalist connection for auto-suggestions -->
        <input list="serials" type="text" id="serial" placeholder="Enter Serial Number" autocomplete="off">
        <datalist id="serials"></datalist>

        <!-- Date -->
        <label>Date (MM/YYYY)</label>
        <input type="text" id="date" placeholder="MM/YYYY" maxlength="7" autocomplete="off">

        <!-- Responsible Person -->
        <label>Responsible Person</label>
        <input list="persons" id="person" placeholder="Select or type a name..." autocomplete="off">
        <datalist id="persons">
            <option value="Mr. Amrut Deshmukh">
            <option value="Mr. Rajaram Mithe">
            <option value="Mr. Umesh Kale">
        </datalist>

        <!-- Button -->
        <button class="generate-btn" onclick="generateQR()">Generate QR Code</button>
    </div>

    <!-- QR Code Modal (Full Screen) -->
    <div id="qrModal" class="modal">
        <span class="close-btn" onclick="closeQRModal()">&times;</span>
        <div id="qrcode"></div>
        <div class="qr-hint">Scan from screen</div>
        <!-- This div will populate the machine details in a smaller font -->
        <div id="qrDetails" class="qr-details"></div>
    </div>

    <!-- Tokens Gallery Modal (Full Screen) -->
    <div id="tokensModal" class="modal">
        <span class="close-btn" onclick="closeTokensModal()">&times;</span>
        
        <div class="token-title" id="tokenTitle">Main Title</div>
        
        <div class="slider-container">
            <img id="tokenImg" src="" alt="Token Image">
        </div>
        
        <!-- Controls moved to the bottom -->
        <div class="token-footer">
            <button class="nav-btn left" onclick="prevToken()">&#10094;</button>
            <div class="token-counter" id="tokenCounter">1 / 5</div>
            <button class="nav-btn right" onclick="nextToken()">&#10095;</button>
        </div>
    </div>

    <script>
        // =========================
        // Handle Auto Suggestions 
        // =========================
        function updateSuggestions() {
            const machineInput = document.getElementById("machine").value.trim();
            const modelInput = document.getElementById("model").value.trim();
            const currentFullModel = modelInput ? "FEBTECH-" + modelInput : "";

            let availableModels = new Set();
            let availableSerials = new Set();

            // Combine external MACHINE_DATA (if exists) with local saved data
            let allData = [];
            if (typeof MACHINE_DATA !== 'undefined') {
                allData = allData.concat(MACHINE_DATA);
            }
            const savedCustomData = JSON.parse(localStorage.getItem("custom_machine_data") || "[]");
            allData = allData.concat(savedCustomData);

            allData.forEach(item => {
                // Splits path format: ./data/Machine Name/Model Number/Serial Number/...
                const parts = item.path.split('/');
                if (parts.length >= 5) {
                    const dbMachine = parts[2];
                    const dbModel = parts[3];
                    const dbSerial = parts[4];

                    if (dbMachine === machineInput) {
                        // Strip FEBTECH- prefix for the dropdown suggestion
                        let cleanModel = dbModel.startsWith("FEBTECH-") ? dbModel.replace("FEBTECH-", "") : dbModel;
                        availableModels.add(cleanModel);

                        // Only suggest serials if the model matches (or if no model is typed yet)
                        if (currentFullModel === "" || dbModel === currentFullModel) {
                            availableSerials.add(dbSerial);
                        }
                    }
                }
            });

            // Populate Models Datalist
            const modelsDatalist = document.getElementById("models");
            modelsDatalist.innerHTML = "";
            availableModels.forEach(m => {
                let opt = document.createElement("option");
                opt.value = m;
                modelsDatalist.appendChild(opt);
            });

            // Populate Serials Datalist
            const serialsDatalist = document.getElementById("serials");
            serialsDatalist.innerHTML = "";
            availableSerials.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s;
                serialsDatalist.appendChild(opt);
            });
        }

        // Listeners to update suggestions as you type/select
        document.getElementById("machine").addEventListener("input", updateSuggestions);
        document.getElementById("machine").addEventListener("change", updateSuggestions);
        document.getElementById("model").addEventListener("input", updateSuggestions);

        // =========================
        // Load Saved Persons
        // =========================
        const personList = document.getElementById("persons");
        let savedPersons = JSON.parse(localStorage.getItem("persons")) || [];

        savedPersons.forEach(name => {
            const option = document.createElement("option");
            option.value = name;
            personList.appendChild(option);
        });

        // =========================
        // Auto Date Format MM/YYYY
        // =========================
        const dateInput = document.getElementById("date");
        dateInput.addEventListener("input", function () {
            let value = this.value.replace(/\D/g, "");
            if (value.length > 6) value = value.substring(0, 6);
            if (value.length >= 3) {
                value = value.substring(0, 2) + "/" + value.substring(2);
            }
            this.value = value;
        });

        // =========================
        // Generate QR Code & Modal
        // =========================
        function generateQR() {
            const machine = document.getElementById("machine").value.trim();
            const modelInput = document.getElementById("model").value.trim();
            const serial = document.getElementById("serial").value.trim();
            const date = document.getElementById("date").value.trim();
            const person = document.getElementById("person").value.trim();

            if (machine == "") return alert("Select Machine Name");
            if (modelInput == "") return alert("Enter Model Number");
            if (serial == "") return alert("Enter Serial Number");
            if (!/^\d{2}\/\d{4}$/.test(date)) return alert("Date must be MM/YYYY");
            if (person == "") return alert("Enter Responsible Person");

            // 1. Save New Person (If necessary)
            if (!savedPersons.includes(person) &&
                person != "Mr. Amrut Deshmukh" &&
                person != "Mr. Rajaram Mithe" &&
                person != "Mr. Umesh Kale") {
                
                savedPersons.push(person);
                localStorage.setItem("persons", JSON.stringify(savedPersons));
                const option = document.createElement("option");
                option.value = person;
                personList.appendChild(option);
            }

            const model = "FEBTECH-" + modelInput;
            
            // 2. Save Data logic to local storage so future suggestions will remember it!
            const newPath = `./data/${machine}/${model}/${serial}/custom_entry/img.jpg`;
            const savedCustomData = JSON.parse(localStorage.getItem("custom_machine_data") || "[]");
            // Check if this path already exists
            if (!savedCustomData.some(item => item.path === newPath)) {
                savedCustomData.push({ path: newPath, date: new Date().toISOString() });
                localStorage.setItem("custom_machine_data", JSON.stringify(savedCustomData));
            }

            // 3. Setup the QR text format
            const qrText = `##########-THIS_NEW_START-##########\n${machine}\n${model}\n${serial}\n${date}\n${person}`;

            // Generate the QR Code Canvas
            const qr = document.getElementById("qrcode");
            qr.innerHTML = "";
            new QRCode(qr, {
                text: qrText,
                width: 280, 
                height: 280,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Populate the details block below the QR Code
            const qrDetails = document.getElementById("qrDetails");
            qrDetails.innerHTML = `
                <div><strong>Machine:</strong> ${machine}</div>
                <div><strong>Model:</strong> ${model}</div>
                <div><strong>Serial Number:</strong> ${serial}</div>
                <div><strong>Date:</strong> ${date}</div>
                <div><strong>Responsible:</strong> ${person}</div>
            `;

            openQRModal();
        }

        // =========================
        // Modal Controls (QR)
        // =========================
        function openQRModal() {
            document.getElementById('qrModal').style.display = 'flex';
        }
        function closeQRModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // =========================
        // Tokens Slider Logic
        // =========================
        const tokens = [
            { src: "tokens_qr_codes_MAIN VISUAL RECORD.webp", title: "MAIN VISUAL RECORD" },
            { src: "tokens_qr_codes_ADDITIONAL VIEW.webp", title: "ADDITIONAL VIEW" },
            { src: "tokens_qr_codes_DAMAGE & ISSUE.webp", title: "DAMAGE & ISSUE" },
            { src: "tokens_qr_codes_ELECTRICAL PANEL.webp", title: "ELECTRICAL PANEL" },
            { src: "tokens_qr_codes_MACHINE ID RECORD.webp", title: "MACHINE ID RECORD" }
        ];
        
        let currentTokenIndex = 0;
        const tokenImgElement = document.getElementById("tokenImg");
        const tokenTitleElement = document.getElementById("tokenTitle");
        const tokenCounterElement = document.getElementById("tokenCounter");

        function openTokensModal() {
            document.getElementById('tokensModal').style.display = 'flex';
            updateTokenView();
        }

        function closeTokensModal() {
            document.getElementById('tokensModal').style.display = 'none';
        }

        function updateTokenView() {
            tokenImgElement.style.opacity = 0; // Fade effect
            setTimeout(() => {
                tokenImgElement.src = tokens[currentTokenIndex].src;
                tokenTitleElement.innerText = tokens[currentTokenIndex].title;
                tokenCounterElement.innerText = `${currentTokenIndex + 1} / ${tokens.length}`;
                tokenImgElement.style.opacity = 1;
            }, 150);
        }

        function nextToken() {
            currentTokenIndex = (currentTokenIndex + 1) % tokens.length;
            updateTokenView();
        }

        function prevToken() {
            currentTokenIndex = (currentTokenIndex - 1 + tokens.length) % tokens.length;
            updateTokenView();
        }

        // Touch Swipe functionality for iPhone/Mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        tokenImgElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        tokenImgElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 40) nextToken(); // Swipe Left
            if (touchEndX > touchStartX + 40) prevToken(); // Swipe Right
        }

        // =========================
        // ENTER & ESCAPE KEYS
        // =========================
        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                // Only generate if neither modal is open
                if (document.getElementById('qrModal').style.display !== 'flex' && 
                    document.getElementById('tokensModal').style.display !== 'flex') {
                    generateQR();
                }
            }
            if (e.key === "Escape") {
                closeQRModal();
                closeTokensModal();
            }
        });
        
        // Initialize suggestions on load
        window.onload = function() {
            updateSuggestions();
        };
    </script>
</body>
</html>
